name: Release Builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          shared-key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1

      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $artifact = "prism-${{ github.ref_name }}-windows-x64.exe"
          Copy-Item target/${{ matrix.target }}/release/prism.exe $artifact

      - name: Prepare artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          artifact="prism-${{ github.ref_name }}-linux-x64"
          cp target/${{ matrix.target }}/release/prism $artifact
          chmod +x $artifact

      - name: Prepare artifact (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            artifact="prism-${{ github.ref_name }}-macos-x64"
          else
            artifact="prism-${{ github.ref_name }}-macos-arm64"
          fi
          cp target/${{ matrix.target }}/release/prism $artifact
          chmod +x $artifact

      - name: Generate checksum (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $artifact = "prism-${{ github.ref_name }}-windows-x64.exe"
          (Get-FileHash $artifact -Algorithm SHA256).Hash | Out-File -FilePath "$artifact.sha256" -NoNewline

      - name: Generate checksum (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            artifact="prism-${{ github.ref_name }}-linux-x64"
          elif [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            artifact="prism-${{ github.ref_name }}-macos-x64"
          else
            artifact="prism-${{ github.ref_name }}-macos-arm64"
          fi
          shasum -a 256 $artifact | cut -d ' ' -f 1 > $artifact.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            prism-${{ github.ref_name }}-*
            prism-${{ github.ref_name }}-*.sha256
          retention-days: 1

  build-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-gui"
          shared-key: ${{ matrix.target }}
          cache-on-failure: true
          workspaces: "src-tauri -> target"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Cache apt packages (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: ${{ runner.os }}-tauri-cli-2.0

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Tauri App
        run: cargo tauri build --target ${{ matrix.target }}
        env:
          CARGO_INCREMENTAL: 0

      - name: Prepare Windows artifacts
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe release-artifacts/
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi release-artifacts/

      - name: Prepare Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage release-artifacts/
          cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb release-artifacts/ || true

      - name: Prepare macOS artifacts
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-artifacts/
          cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz release-artifacts/ || true

      - name: Generate checksums (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Get-ChildItem release-artifacts/* | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $hash | Out-File -FilePath "$($_.FullName).sha256" -NoNewline
          }

      - name: Generate checksums (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd release-artifacts
          for file in *; do
            if [ -f "$file" ]; then
              shasum -a 256 "$file" | cut -d ' ' -f 1 > "$file.sha256"
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.target }}
          path: release-artifacts/*
          retention-days: 1

  release:
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -lah release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
