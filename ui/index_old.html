<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prism - Psychology Data Processor</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      .container {
        background: white;
        padding: 2.5rem;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 600px;
      }

      h1 {
        color: #333;
        margin: 0 0 0.5rem 0;
        font-size: 2rem;
        font-weight: 700;
      }

      .subtitle {
        color: #666;
        margin: 0 0 2rem 0;
        font-size: 0.95rem;
      }

      .section {
        margin-bottom: 1.5rem;
      }

      .section-label {
        font-weight: 600;
        color: #333;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
        display: block;
      }

      /* Drop zones */
      .drop-zone {
        border: 2px dashed #cbd5e0;
        border-radius: 8px;
        padding: 2rem;
        text-align: center;
        background: #f7fafc;
        cursor: pointer;
        transition: all 0.3s;
        position: relative;
      }

      .drop-zone:hover {
        border-color: #667eea;
        background: #edf2f7;
      }

      .drop-zone.drag-over {
        border-color: #667eea;
        background: #e6f2ff;
        transform: scale(1.02);
      }

      .drop-zone-icon {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
      }

      .drop-zone-text {
        color: #4a5568;
        font-size: 0.95rem;
      }

      .file-selected {
        background: #e6f7ed;
        border-color: #48bb78;
        padding: 1rem;
      }

      .file-name {
        color: #2d3748;
        font-weight: 500;
        word-break: break-all;
        margin-top: 0.5rem;
        font-size: 0.85rem;
      }

      /* Config section */
      .config-options {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      .btn-secondary {
        flex: 1;
        background: #e2e8f0;
        color: #2d3748;
        border: none;
        padding: 0.75rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        transition: background 0.2s;
      }

      .btn-secondary:hover {
        background: #cbd5e0;
      }

      .config-editor {
        display: none;
        margin-top: 1rem;
      }

      .config-editor.active {
        display: block;
      }

      textarea {
        width: 100%;
        min-height: 300px;
        padding: 1rem;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-family: "Consolas", "Monaco", monospace;
        font-size: 0.85rem;
        resize: vertical;
        line-height: 1.5;
      }

      textarea:focus {
        outline: none;
        border-color: #667eea;
      }

      /* Output location */
      .output-display {
        background: #f7fafc;
        padding: 1rem;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        font-family: "Consolas", "Monaco", monospace;
        font-size: 0.85rem;
        color: #4a5568;
        word-break: break-all;
      }

      /* Primary button */
      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 1rem 2rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        width: 100%;
        margin-top: 1.5rem;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .btn-primary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      /* Status display */
      #status {
        margin-top: 1.5rem;
        padding: 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        line-height: 1.6;
        display: none;
        white-space: pre-line;
        word-break: break-word;
      }

      #status.show {
        display: block;
      }

      #status.success {
        background: #e6f7ed;
        color: #276749;
        border: 1px solid #48bb78;
      }

      #status.error {
        background: #fff5f5;
        color: #742a2a;
        border: 1px solid #fc8181;
      }

      #status.processing {
        background: #ebf8ff;
        color: #2c5282;
        border: 1px solid #4299e1;
      }

      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid #4299e1;
        border-radius: 50%;
        border-top-color: transparent;
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔬 Prism</h1>
      <p class="subtitle">Psychology Survey Data Processor</p>

      <!-- CSV File Section -->
      <div class="section">
        <label class="section-label">1. CSV Data File</label>
        <div id="csvDropZone" class="drop-zone">
          <div class="drop-zone-icon">📊</div>
          <div class="drop-zone-text">
            Drop CSV file here or click to browse
          </div>
        </div>
      </div>

      <!-- Config Section -->
      <div class="section">
        <label class="section-label">2. Configuration</label>
        <div class="config-options">
          <button class="btn-secondary" onclick="useExistingConfig()">
            📂 Use Existing
          </button>
          <button class="btn-secondary" onclick="toggleConfigEditor()">
            ✏️ Edit Config
          </button>
        </div>

        <div id="configEditor" class="config-editor">
          <textarea id="configTextarea" spellcheck="false"></textarea>
        </div>

        <div
          id="configStatus"
          style="
            display: none;
            margin-top: 0.75rem;
            font-size: 0.85rem;
            color: #48bb78;
          "
        >
          ✓ Config ready
        </div>
      </div>

      <!-- Output Location Section -->
      <div class="section">
        <label class="section-label">3. Output Location</label>
        <div id="outputLocation" class="output-display">
          Will be determined from CSV location...
        </div>
      </div>

      <!-- Process Button -->
      <button
        id="processBtn"
        class="btn-primary"
        onclick="processData()"
        disabled
      >
        ▶ Process Data
      </button>

      <!-- Status Display -->
      <div id="status"></div>
    </div>

    <script>
      // Check if Tauri API is available
      if (!window.__TAURI__) {
        document.body.innerHTML = `
          <div class="container">
            <h1>⚠️ Error</h1>
            <p style="color: #e53e3e;">Tauri API not available. Please run this application through Tauri.</p>
            <p style="font-size: 0.85rem; color: #666;">
              Run: <code style="background: #f7fafc; padding: 0.25rem 0.5rem; border-radius: 4px;">cargo tauri dev</code>
            </p>
          </div>
        `;
        throw new Error("Tauri API not loaded");
      }

      let csvFilePath = null;
      let configFilePath = null;
      let configText = null;
      let isEditingConfig = false;

      // Initialize with template config
      async function initConfigTemplate() {
        try {
          const template = await window.__TAURI__.core.invoke(
            "generate_config_template"
          );
          document.getElementById("configTextarea").value = template;
          configText = template;
        } catch (error) {
          console.error("Failed to load template:", error);
        }
      }

      initConfigTemplate();

      // CSV Drop Zone
      const csvDropZone = document.getElementById("csvDropZone");
      let fileSelected = false;

      csvDropZone.addEventListener("click", async (e) => {
        // Prevent file picker if clicking on a button inside or already selected
        if (e.target.tagName === "BUTTON" || fileSelected) {
          return;
        }

        try {
          const filePath = await window.__TAURI__.core.invoke("pick_file");
          if (filePath) {
            fileSelected = true;
            handleCSVSelected(filePath);
          }
        } catch (error) {
          console.error("Error picking file:", error);
          showStatus("Failed to open file picker: " + error, "error");
        }
      });

      csvDropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        csvDropZone.classList.add("drag-over");
      });

      csvDropZone.addEventListener("dragleave", () => {
        csvDropZone.classList.remove("drag-over");
      });

      csvDropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        csvDropZone.classList.remove("drag-over");

        // Note: Tauri doesn't support HTML5 drag-drop directly
        // This would require additional Tauri configuration
        showStatus(
          "Drag-drop from file system not yet supported. Please use the file picker.",
          "error"
        );
      });

      function handleCSVSelected(filePath) {
        csvFilePath = filePath;

        // Update UI - remove click listener effect
        csvDropZone.classList.add("file-selected");
        csvDropZone.style.cursor = "default";
        csvDropZone.innerHTML = `
          <div class="drop-zone-icon">✅</div>
          <div class="drop-zone-text">CSV file selected</div>
          <div class="file-name">${filePath}</div>
          <div style="margin-top: 1rem;">
            <button onclick="event.stopPropagation(); resetCSVSelection()" style="padding: 0.5rem 1rem; background: #e2e8f0; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem;">
              🔄 Choose Different File
            </button>
          </div>
        `;

        // Update output location preview
        updateOutputLocation(filePath);

        // Enable process button if config is ready
        updateProcessButton();
      }

      function resetCSVSelection() {
        csvFilePath = null;
        fileSelected = false;
        csvDropZone.classList.remove("file-selected");
        csvDropZone.style.cursor = "pointer";
        csvDropZone.innerHTML = `
          <div class="drop-zone-icon">📊</div>
          <div class="drop-zone-text">Drop CSV file here or click to browse</div>
        `;
        document.getElementById("outputLocation").textContent =
          "Will be determined from CSV location...";
        updateProcessButton();
      }

      function updateOutputLocation(csvPath) {
        // Simulate the backend logic
        const parts = csvPath.split(/[\\/]/);
        const parentFolder = parts[parts.length - 2] || "";

        let outputPath;
        if (
          ["raw_data", "raw", "data", "input"].includes(
            parentFolder.toLowerCase()
          )
        ) {
          // Go up one level and create processed/
          const parentIndex = parts.length - 2;
          outputPath = parts.slice(0, parentIndex).join("\\") + "\\processed\\";
        } else {
          // Create processed/ in same directory
          outputPath = parts.slice(0, -1).join("\\") + "\\processed\\";
        }

        document.getElementById("outputLocation").textContent = outputPath;
      }

      async function useExistingConfig() {
        try {
          const filePath = await window.__TAURI__.core.invoke("pick_config");
          if (filePath) {
            configFilePath = filePath;
            isEditingConfig = false;

            document.getElementById("configEditor").classList.remove("active");
            document.getElementById("configStatus").style.display = "block";
            document.getElementById(
              "configStatus"
            ).innerHTML = `✓ Using: ${filePath.split(/[\\/]/).pop()}`;

            updateProcessButton();
          }
        } catch (error) {
          console.error("Error picking config:", error);
          showStatus("Failed to open config picker: " + error, "error");
        }
      }

      function toggleConfigEditor() {
        isEditingConfig = !isEditingConfig;
        const editor = document.getElementById("configEditor");
        const status = document.getElementById("configStatus");

        if (isEditingConfig) {
          editor.classList.add("active");
          status.style.display = "block";
          status.innerHTML = "✏️ Editing custom configuration";
          configFilePath = null; // Use text instead
        } else {
          editor.classList.remove("active");
          status.style.display = "none";
        }

        updateProcessButton();
      }

      function updateProcessButton() {
        const btn = document.getElementById("processBtn");
        const hasCSV = csvFilePath !== null;
        const hasConfig = configFilePath !== null || isEditingConfig;

        btn.disabled = !(hasCSV && hasConfig);
      }

      async function processData() {
        const statusEl = document.getElementById("status");
        const btn = document.getElementById("processBtn");

        btn.disabled = true;
        showStatus(
          '<span class="spinner"></span>Processing data...',
          "processing"
        );

        try {
          let configToUse = configFilePath;

          // If editing config, save it to a temp file first
          if (isEditingConfig) {
            const configContent =
              document.getElementById("configTextarea").value;

            try {
              configToUse = await window.__TAURI__.core.invoke(
                "save_config_text",
                {
                  configText: configContent,
                  csvPath: csvFilePath,
                }
              );
            } catch (error) {
              showStatus("Failed to save config: " + error, "error");
              btn.disabled = false;
              return;
            }
          }

          const result = await window.__TAURI__.core.invoke("run_analysis", {
            inputPath: csvFilePath,
            configPath: configToUse,
          });

          if (result.includes("Success") || result.includes("✅")) {
            showStatus(result, "success");
          } else {
            showStatus(result, "error");
          }
        } catch (error) {
          console.error(error);
          showStatus("System Error: " + error, "error");
        } finally {
          btn.disabled = false;
        }
      }

      function showStatus(message, type) {
        const statusEl = document.getElementById("status");
        statusEl.className = "show " + type;
        statusEl.innerHTML = message;
      }

      // Listen for textarea changes
      document
        .getElementById("configTextarea")
        .addEventListener("input", () => {
          configText = document.getElementById("configTextarea").value;
        });
    </script>
  </body>
</html>
