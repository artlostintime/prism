[book]
title = "Prism Documentation"
authors = ["Shuvi"]
description = "Comprehensive documentation for Prism - Psychology survey data processor"
language = "en"
multilingual = false
src = "docs"

[build]
build-dir = "book"
create-missing = true

[preprocessor.links]
# Enable relative links between chapters

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/artlostintime/prism"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/artlostintime/prism/edit/main/docs/{path}"
site-url = "/prism/"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = true
level = 1

[output.html.print]
enable = true
