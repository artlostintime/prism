[package]
name = "prism"
version = "0.8.8"
edition = "2021"
description = "Psychology survey data processing - Automated scoring, quality checks, and statistical reporting with Cronbach's alpha"
authors = ["Shuvi"]
license = "MIT"
repository = "https://github.com/artlostintime/prism"
documentation = "https://github.com/artlostintime/prism/tree/main/docs"
readme = "README.md"
keywords = ["psychology", "survey", "psychometrics", "research", "data-processing"]
categories = ["command-line-utilities", "science"]
exclude = [
    "target/",
    "src-tauri/target/",
    "data/",
    ".git/",
    ".github/",
]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.10"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
rayon = "1.8"
strsim = "0.11"
thiserror = "1.0"
rust_xlsxwriter = "0.72"
indicatif = "0.17"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
ctor = "0.2"
proptest = "1.4"
tempfile = "3.8"
criterion = "0.5"

# Performance optimizations
[profile.release]
opt-level = 3           # Maximum optimization
lto = "fat"             # Link-time optimization
codegen-units = 1       # Better optimization at cost of compile time
strip = true            # Remove debug symbols
panic = 'abort'         # Smaller binary, faster panics

[profile.bench]
inherits = "release"

# Faster development builds
[profile.dev]
opt-level = 1           # Some optimization for faster dev testing
