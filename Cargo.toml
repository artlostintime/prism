[package]
name = "prism"
version = "0.1.0"
edition = "2021"
description = "Psychology survey data processing pipeline - Automated scoring, quality checks, and statistical reporting"
authors = ["Shuvi"]
license = "MIT"
repository = "https://github.com/artlostintime/prism"
keywords = ["psychology", "survey", "psychometrics", "research", "data-processing"]
categories = ["command-line-utilities", "science"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.10"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
rayon = "1.8"
indicatif = "0.17"
serde_json = "1.0"
strsim = "0.11"
thiserror = "1.0"
rust_xlsxwriter = "0.72"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
ctor = "0.2"
proptest = "1.4"

# Performance optimizations
[profile.release]
opt-level = 3           # Maximum optimization
lto = "fat"             # Link-time optimization
codegen-units = 1       # Better optimization at cost of compile time
strip = true            # Remove debug symbols
panic = 'abort'         # Smaller binary, faster panics

[profile.bench]
inherits = "release"

# Faster development builds
[profile.dev]
opt-level = 1           # Some optimization for faster dev testing
